<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>regisration page</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card" style="max-width: 500px; margin: 0 auto; padding: 20px;">
            <div class="card-body">
                <h2 class="card-title text-center">Regisration</h2>
                <form  id="registerForm">
                    <div class="mb-3">
                        <label for="fullname" class="form-label">Fullname</label>
                        <input type="text" class="form-control" id="fullname" name="fullname" required>
                        <div class="invalid-feedback">Only letters are allowed</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                        <div class="invalid-feedback">Enter a valid email</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="invalid-feedback">Password must be at least 6 chars, with at least 1 speical chars </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="for-check-input" id="terms" required>
                        <label for="terms" class="form-check-lablel"> I agree to terms of services </label>
                        <div class="invalid-feedback">You must agree to terms of services </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="mt-3 text-center">Already register? <a href="#">Login</a></p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit',
            function(event){
                event.preventDefault();
                //full name validation (only letters allowed)
                const fullname = document.getElementById('fullname').value;
                const fullnameRegex = /^[a-zA-Z\s]+$/;
                if(!fullnameRegex.test(fullname)){
                    document.getElementById('fullname').classList.add('is-invalid');
                    return;
                }else{document.getElementById('fullname').classList.remove('is-invalid');
                }
                //email validation(example@example.com)
                const email = document.getElementById('email').value;
                const emailRegex = /^[a-zA-Z0-9.-]+@[[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/;
                if(!emailRegex.test(email)){
                    document.getElementById('email').classList.add('is-invalid');
                    return;
                }else{document.getElementById('email').classList.remove('is-invalid');
                }
                // password validation (at least 6 chars and 1 special char)
                const password = document.getElementById('password').value;
                const passwordRegex = /^(?=.*[!@#$%^&*()<>|\/?{"'}]).{6,}$/;
                if(!passwordRegex.test(password)){
                    document.getElementById('password').classList.add('is-invalid');
                    return;
                }else{document.getElementById('password').classList.remove('is-invalid');
                }
            }
        );
    </script>
</body>
</html>
